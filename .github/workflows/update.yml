name: Update Filtered RSS Feed

on:
  schedule:
    - cron: "0 * * * *"   # runs every hour
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: |
        pip install feedparser feedgen requests

    - name: Generate filtered feed from live URLs
      run: |
        cat > script.py << 'PYEOF'
        import feedparser
        import requests
        from feedgen.feed import FeedGenerator

        with open("feeds.txt") as f:
            urls = [line.strip() for line in f if line.strip()]

        keywords = [
            "primates",
            "non-human primates",
            "beagles",
            "animal research",
            "animal rights protests",
            "animal experiments",
            "animal testing",
            "dog experiments",
            "breeding",
            "NAMs",
            "animal model",
            "Paula Clifford",
            "Naomi Charalambakis"
        ]

        fg = FeedGenerator()
        fg.title("Filtered Animal Research Monitoring Feed")
        fg.link(href="https://github.com/alabuza/ar-monitoring")
        fg.description("Live feed filtered by targeted keywords.")

        for url in urls:
            try:
                data = requests.get(url, timeout=10).content
                parsed = feedparser.parse(data)
            except Exception:
                continue

            for entry in parsed.entries:
                text = " ".join([
                    entry.get("title", ""),
                    entry.get("summary", ""),
                    entry.get("description", "")
                ]).lower()

                matched = [k for k in keywords if k.lower() in text]

                if matched:
                    fe = fg.add_entry()
                    fe.title(entry.get("title", ""))
                    fe.link(href=entry.get("link", ""))
                    fe.description(entry.get("summary", ""))

                    for m in matched:
                        fe.category(term=m)

        fg.rss_file("filtered_feed.xml")
        PYEOF

        python3 script.py


    - name: Commit filtered feed
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add filtered_feed.xml
        git commit -m "Update filtered RSS feed" || echo "No changes to commit"
        git push
